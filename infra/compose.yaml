services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d jobs"]
      interval: 10s
      retries: 5
    ports:
      - "127.0.0.1:5434:5432"
    networks: [agentnet]

volumes:
  pgdata:

networks:
  agentnet:
    name: agentnet